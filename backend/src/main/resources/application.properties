spring.application.name=movie-tracker-backend

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movie_tracker?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.default-property-inclusion=non_null

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

tmdb.api-key=${TMDB_API_KEY:}
tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}
tmdb.image-base-url=${TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p/w500}
tmdb.language=${TMDB_LANGUAGE:ru-RU}
tmdb.movie-pages=${TMDB_MOVIE_PAGES:3}
tmdb.tv-pages=${TMDB_TV_PAGES:2}
tmdb.timeout-seconds=${TMDB_TIMEOUT_SECONDS:10}
